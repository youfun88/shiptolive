@font-face { font-family: "Inter"; src: url("/assets/fonts/inter-latin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root { --bg:#efebe6; --ink:#161513; --ink2:#4a4743; --ink3:#625e58; --or:#d7612a; --or2:#b8501d; --card:#f7f5f2;

* { box-sizing:border-box; }
html,body { margin:0; }
body { min-height:100svh; background:var(--bg); color:var(--ink); font:400 16px/1.6 var(--sans); -webkit-font-smoothing:antialiased;

.page { width:100%; max-width:560px; display:grid; gap:22px; justify-items:center; }
.top { width:100%; display:flex; justify-content:space-between; align-items:center; font-size:14px; }
.top a { color:var(--ink2); text-decoration:none; display:inline-flex; gap:8px; align-items:center; font-weight:600; }
.top a svg { width:22px; height:22px; }
.top .lang { font:600 13px/1 var(--mono); border:1px solid rgba(22,21,19,.2); border-radius:8px; padding:7px 10px; }

/* the card */
.stage { width:100%; perspective:1400px; }
.card { position:relative; width:100%; aspect-ratio:1.75/1; transform-style:preserve-3d; transition:transform .8s cubic-bezier(.2,.8,.2,1); cursor:pointer; outline:none; }
.card.flip { transform:rotateY(180deg); }
.face { position:absolute; inset:0; border-radius:18px; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden;

.front { background:var(--ink); color:#f3efe9; padding:clamp(18px,5vw,30px); display:grid; grid-template-rows:auto 1fr auto; }

.front .brand svg { width:clamp(28px,7vw,38px); height:auto; color:#f3efe9; }

.front .ai { align-self:center; justify-self:end; text-align:right; display:grid; gap:8px; max-width:78%; }

.tag { display:inline-block; background:var(--or); color:#fff; font-weight:800; border-radius:999px; padding:1px 9px; margin-left:4px; }
.front .foot { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
.motto { font-weight:700; letter-spacing:.12em; font-size:clamp(10px,2.4vw,12.5px); color:#cfc9c1; }

.dot2 { position:absolute; left:-30px; bottom:-60px; width:140px; height:140px; border-radius:50%; border:1px solid rgba(255,255,255,.08); }

.back { transform:rotateY(180deg); background:var(--card); padding:clamp(16px,4.6vw,28px); display:grid; grid-template-columns:1fr auto; gap:clamp(10px,3vw,20px); align-items:stretch; }
.who h1 { margin:0; font-size:clamp(19px,5vw,27px); line-height:1.15; letter-spacing:-.01em; }

.role { margin:4px 0 0; font-size:clamp(11px,2.7vw,13.5px); color:var(--ink2); line-height:1.45; }
.role b { color:var(--or2); }
.lines { margin:clamp(8px,2.6vw,16px) 0 0; padding:0; list-style:none; display:grid; gap:clamp(2px,.8vw,5px); font-size:clamp(10.5px,2.6vw,13px); }
.lines li { display:flex; gap:8px; align-items:baseline; color:var(--ink); white-space:nowrap; }

.side { display:grid; justify-items:center; align-content:space-between; }

.flipbtn { font:600 14px/1 var(--sans); color:var(--ink2); background:none; border:1px solid rgba(22,21,19,.22); border-radius:999px; padding:10px 16px; cursor:pointer; display:inline-flex; gap:8px; align-items:center; }
.flipbtn:hover { border-color:var(--ink); color:var(--ink); }

.actions { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.actions a.primary { grid-column:1 / -1; background:var(--or2); color:#fff; border-color:var(--or2); font-size:16px; }

<script>
(function () {
  var card = document.getElementById('card'), btn = document.getElementById('flipbtn'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function flip() { card.classList.toggle('flip'); }
  card.addEventListener('click', flip); btn.addEventListener('click', flip);
  card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });

    card.addEventListener('pointermove', function (e) {
      var r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;

      card.style.setProperty('--sx', (50 + x * 80) + '%');
    });
    card.addEventListener('pointerleave', function () { card.style.transition = ''; card.style.transform = ''; });
    card.addEventListener('click', function () { card.style.transition = ''; card.style.transform = ''; });
