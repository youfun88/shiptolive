<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>四年級練習：數學和自然</title>
<style>
  :root {
    --bg: #f6f7f4; --card: #ffffff; --ink: #1d2433; --muted: #5d6675; --line: #d6dae0;
    --accent: #1f5fa8; --good: #17693a; --good-bg: #e4f5ea; --bad: #a92c21; --bad-bg: #fbe9e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 19px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  main { max-width: 660px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 16px; margin: 0 0 20px; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-bottom: 6px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .count { color: var(--muted); font-size: 15px; margin-bottom: 8px; }
  .jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .jump button { min-width: 34px; height: 34px; padding: 0 6px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; }
  .jump button.ok { background: var(--good-bg); border-color: var(--good); }
  .jump button.bad { background: var(--bad-bg); border-color: var(--bad); }
  .jump button.cur { outline: 2px solid var(--accent); outline-offset: 1px; font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .tag { display: inline-block; font-size: 13px; color: var(--accent); background: #e8f0fa; border-radius: 999px; padding: 2px 10px; margin-bottom: 10px; }
  .q { font-size: 21px; font-weight: 600; margin: 0 0 16px; white-space: pre-line; }
  .choices { display: grid; gap: 10px; }
  button { font: inherit; cursor: pointer; }
  .choice {
    display: flex; gap: 12px; align-items: center; width: 100%; min-height: 54px; padding: 10px 14px; text-align: left;
    color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 10px;
  }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice:disabled { cursor: default; color: var(--ink); }
  .choice.right { background: var(--good-bg); border-color: var(--good); }
  .choice.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .num { flex: none; font-weight: 700; color: var(--muted); }
  .fields { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 20px; }
  .fields input {
    width: 9.5em; max-width: 100%; min-height: 50px; padding: 8px 10px; font: inherit; font-size: 22px; text-align: center;
    color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 10px;
  }
  .fields input.short { width: 5.5em; }
  .fields input:focus { outline: none; border-color: var(--accent); }
  .fields input.right { background: var(--good-bg); border-color: var(--good); }
  .fields input.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .feedback { margin-top: 16px; padding: 12px 14px; border-radius: 10px; }
  .feedback.right { background: var(--good-bg); color: var(--good); }
  .feedback.wrong { background: var(--bad-bg); color: var(--bad); }
  .feedback strong { display: block; }
  .feedback .how { color: var(--ink); margin-top: 6px; white-space: pre-line; }
  .primary {
    width: 100%; min-height: 54px; margin-top: 16px; color: #fff; background: var(--accent);
    border: 0; border-radius: 10px; font-weight: 600;
  }
  .primary:disabled { opacity: .45; cursor: default; }
  .secondary {
    width: 100%; min-height: 54px; margin-top: 10px; color: var(--accent); background: transparent;
    border: 2px solid var(--accent); border-radius: 10px; font-weight: 600;
  }
  .stop { float: right; min-height: 44px; padding: 6px 0 6px 12px; color: var(--muted); background: transparent; border: 0; font-size: 15px; }
  .back { min-height: 44px; padding: 6px 12px 6px 0; margin-bottom: 10px; color: var(--accent); background: transparent; border: 0; font-size: 16px; font-weight: 600; }
  .pick b { display: block; }
  .meta { display: block; color: var(--muted); font-size: 15px; }
  .score { font-size: 52px; font-weight: 700; line-height: 1.1; margin: 0; }
  .msg { margin: 6px 0 18px; }
  h2 { font-size: 18px; margin: 18px 0 8px; }
  .missed { list-style: none; margin: 0; padding: 0; }
  .missed li { padding: 12px 0; border-top: 1px solid var(--line); }
  .missed b { display: block; font-weight: 600; white-space: pre-line; margin-bottom: 6px; }
  .ba { display: block; margin: 6px 0; padding: 8px 10px; border-left: 3px solid; border-radius: 4px; font-size: 17px; }
  .ba small { display: block; font-size: 13px; font-weight: 700; }
  .ba.was { color: var(--bad); background: var(--bad-bg); }
  .ba.now { color: var(--good); background: var(--good-bg); }
  .missed .how { color: var(--muted); font-size: 16px; white-space: pre-line; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1 id="title">四年級練習</h1>
  <p class="sub" id="sub">選一個單元開始練習。</p>
  <div id="app" aria-live="polite"></div>
</main>
<script>
// Built from Joie's graded tests (units 1, 2, 3 and 5). The first unit repeats the
// questions she got wrong with the same numbers; the others practise the same kinds of mistake. Answers are checked in code below; keep them right.
//   mc:  options + answer (index)
//   ask: fields [{ ans, after }] in order, typed answers; `after` is the unit shown after the box
var UNITS = [
  {
    title: '考卷錯題重練', sub: '她考卷上錯的題目，數字一樣',
    qs: [
      { mc: ['1000', '10000', '100000', '1000000'], answer: 2, q: '【第一單元】100 個千和 1000 個百，都是表示多少？', how: '100 個千 = 100 × 1000 = 100000\n1000 個百 = 1000 × 100 = 100000' },
      { mc: ['11990 元', '11999 元', '12000 元', '12099 元'], answer: 1, q: '【第一單元】餐廳老闆把今天的收入全部換成百元鈔，最多可以換到 119 張。今天的收入最多可能是多少元？', how: '119 張百元鈔是 11900 元。\n不滿 100 元的零錢最多 99 元，所以最多 11999 元。' },
      { mc: ['十萬位', '萬位', '千位', '百位'], answer: 1, q: '【第一單元】把「三千零七萬」記在位值表上時，0 不會出現在哪一位？', how: '三千零七萬 = 30070000\n萬位是 7，其他空的位都是 0。' },
      { mc: ['1080700 元', '115000 元', '108700 元', '80800 元'], answer: 2, q: '【第一單元】年終獎金全部換成千元鈔，剛好換到 108 張千元鈔和剩下 7 張百元鈔。獎金是多少元？', how: '108 張千元 = 108000\n7 張百元 = 700\n108000 + 700 = 108700' },
      { q: '【第一單元】位值表：千萬位 7、百萬位 1、十萬位空著、萬位 4，其他都是 0。\n奇奇填出全班最大的數，莉莉填出最小的數，兩個八位數相差多少？', fields: [{ ans: 900000 }], how: '奇奇填 9：71940000\n莉莉填 0：71040000\n只有十萬位不同，相差 900000（不是 9000000）' },
      { q: '【第一單元】視力不良的男生有 27 萬 4600 人，女生有 26 萬 8700 人。視力不良的共有多少人？', fields: [{ ans: 543300, after: '人' }], how: '274600 + 268700 = 543300' },
      { q: '【第一單元】國小學生有 120 萬 5000 人，視力不良的有 543300 人。視力良好的有多少人？', fields: [{ ans: 661700, after: '人' }], how: '1205000 − 543300 = 661700' },
      { q: '【第一單元】572 萬 − 246 萬 = ？', fields: [{ ans: 326, after: '萬' }], how: '572 − 246 = 326，答案是 326 萬。\n個位 2 − 6 不夠減，要向十位借 1：12 − 6 = 6，十位 6 − 4 = 2。' },
      { q: '【第一單元】832 萬 6000 − 609 萬 3000 = ？\n（寫成數字）', fields: [{ ans: 2233000 }], how: '8326000 − 6093000 = 2233000\n先把萬換成數字，位數對齊再減。' },
      { q: '【第一單元】上半年進口 2064100 個，下半年進口 1825300 個。相差多少個？', fields: [{ ans: 238800, after: '個' }], how: '2064100 − 1825300 = 238800\n借位時，被借的那一位要記得少 1。' },
      { q: '【第一單元】今年玉米收成 95 萬 500 公斤，比去年多了 3000 公斤。去年收成多少公斤？', fields: [{ ans: 947500, after: '公斤' }], how: '今年比較多，去年比較少，用減的：\n950500 − 3000 = 947500（3000 不是 30000）' },
      { q: '【第一單元】姐姐去年賺了三十八萬 6000 元，今年賺了二十九萬 5000 元。兩年一共賺了多少元？', fields: [{ ans: 681000, after: '元' }], how: '386000 + 295000 = 681000\n「萬」不能丟掉，不是只加 6000 + 5000。' },
      { q: '【第一單元】12 月的遊客是 103400 人，比 11 月多 15000 人。11 月的遊客是多少人？', fields: [{ ans: 88400, after: '人' }], how: '12 月比 11 月多，11 月比較少：\n103400 − 15000 = 88400' },
      { q: '【第一單元】10 月 81000 人、11 月 88400 人、12 月 103400 人。三個月一共多少人？', fields: [{ ans: 272800, after: '人' }], how: '81000 + 88400 + 103400 = 272800' },
      { q: '【第一單元】上個月的盈收是 3144000 元，上個月比這個月少 18 萬 5000 元。這個月的盈收是多少元？', fields: [{ ans: 3329000, after: '元' }], how: '上個月比較少，這個月比較多，用加的：\n3144000 + 185000 = 3329000\n18 萬 5000 = 185000，不是 1805000。' },
      { q: '【第一單元】民國 110 年人口約 2337 萬人，109 年比 110 年多約 18 萬人。109 年約多少人？\n（寫成數字）', fields: [{ ans: 23550000, after: '人' }], how: '2337 萬 + 18 萬 = 2355 萬 = 23550000' },
      { mc: ['3410 頁', '3355 頁', '3300 頁', '3100 頁'], answer: 0, q: '【第二單元】哥哥每天寫 55 頁，從 7 月 1 日寫到 8 月 31 日剛好寫完。這本小說最多有幾頁？', how: '7 月 31 天 + 8 月 31 天 = 62 天\n55 × 62 = 3410' },
      { mc: ['剩下 40 顆', '剩下 140 顆', '不夠 40 顆', '不夠 140 顆'], answer: 1, q: '【第二單元】一條巧克力 3 顆，一盒 12 條，一箱 40 盒。學校買一箱送給 1300 名學生每人 1 顆，會剩下還是不夠幾顆？', how: '一盒 3 × 12 = 36 顆\n一箱 36 × 40 = 1440 顆\n1440 − 1300 = 140，剩下 140 顆。' },
      { mc: ['5875 元', '5640 元', '5405 元', '2350 元'], answer: 1, q: '【第二單元】一盒波士頓派 235 元，每買 10 盒送 1 盒。送來了 26 盒，一共付了多少元？', how: '付 10 盒拿 11 盒。26 = 11 + 11 + 4\n要付 10 + 10 + 4 = 24 盒\n235 × 24 = 5640' },
      { q: '【第二單元】不用直式：一盒玫瑰 500 元，買 99 盒要多少元？', fields: [{ ans: 49500, after: '元' }], how: '500 × 100 = 50000\n少買 1 盒，減掉 500：50000 − 500 = 49500' },
      { q: '【第二單元】34 × 27 = ？', fields: [{ ans: 918 }], how: '34 × 7 = 238\n34 × 20 = 680\n238 + 680 = 918' },
      { q: '【第二單元】一盞燈賣 126 元，有 263 盞，一共可以賣多少元？', fields: [{ ans: 33138, after: '元' }], how: '126 × 3 = 378\n126 × 60 = 7560\n126 × 200 = 25200\n378 + 7560 + 25200 = 33138\n相加時進位要算清楚。' },
      { q: '【第五單元】10001 公尺 = 幾公里幾公尺？', fields: [{ ans: 10, after: '公里' }, { ans: 1, after: '公尺' }], how: '10000 公尺 = 10 公里\n10001 = 10000 + 1 → 10 公里 1 公尺' },
      { q: '【第五單元】6 公里 7 公尺 = 多少公尺？', fields: [{ ans: 6007, after: '公尺' }], how: '6 公里 = 6000 公尺，再加 7 → 6007' },
      { q: '【第五單元】美國東西全長約 4500 公里，是多少公尺？', fields: [{ ans: 4500000, after: '公尺' }], how: '1 公里 = 1000 公尺\n4500 × 1000 = 4500000' },
      { q: '【第五單元】10 公里 − 2 公里 50 公尺 = 多少公尺？', fields: [{ ans: 7950, after: '公尺' }], how: '10 公里 = 10000 公尺\n2 公里 50 公尺 = 2050 公尺\n10000 − 2050 = 7950（不是 795）' },
      { q: '【第五單元】一條 15 公分的緞帶，剪掉 7 公分 4 毫米，還剩幾公分幾毫米？', fields: [{ ans: 7, after: '公分' }, { ans: 6, after: '毫米' }], how: '1 公分 = 10 毫米（不是 1000）\n15 公分 = 150 毫米，7 公分 4 毫米 = 74 毫米\n150 − 74 = 76 毫米 = 7 公分 6 毫米' },
      { q: '【第五單元】祝山到阿里山 26 公里 80 公尺，阿里山到奮起湖 6 公里 250 公尺。前面比後面長幾公里幾公尺？', fields: [{ ans: 19, after: '公里' }, { ans: 830, after: '公尺' }], how: '26 公里 80 公尺 = 26080 公尺（80 寫成 080）\n6 公里 250 公尺 = 6250 公尺\n26080 − 6250 = 19830 → 19 公里 830 公尺' }
    ]
  },
  {
    title: '第一單元：大數（萬）', sub: '萬的換算、借位減法、「多」和「少」',
    qs: [
      { mc: ['1000', '10000', '100000', '1000000'], answer: 2, q: '「1000 個百」和下面哪個數一樣？', how: '1000 個百 = 1000 × 100 = 100000' },
      { mc: ['8500 元', '8599 元', '8600 元', '8590 元'], answer: 1, q: '老闆把今天的收入全部換成百元鈔，最多換到 85 張。今天的收入最多可能是多少元？', how: '85 張百元鈔是 8500 元。還沒滿 100 元的零錢最多 99 元，所以最多是 8599 元。' },
      { mc: ['十萬位', '萬位', '千位', '百位'], answer: 1, q: '把「四千零六萬」寫成數字，0 不會出現在哪一位？', how: '四千零六萬 = 40060000\n千萬位 4、百萬位 0、十萬位 0、萬位 6，後面都是 0。\n所以 0 不會出現在萬位。' },
      { q: '爸爸換到 215 張千元鈔和 6 張百元鈔，一共是多少元？', fields: [{ ans: 215600, after: '元' }], how: '215 張千元 = 215000 元\n6 張百元 = 600 元\n215000 + 600 = 215600' },
      { q: '「三千零九萬四千」記作多少？', fields: [{ ans: 30094000 }], how: '3009 萬 = 30090000，再加 4000\n= 30094000' },
      { q: '463 萬 − 158 萬 = ？', fields: [{ ans: 305, after: '萬' }], how: '萬的單位一樣，直接算 463 − 158 = 305\n答案是 305 萬。不要多寫一個數字。' },
      { q: '726 萬 4000 − 518 萬 6000 = ？\n（寫成數字）', fields: [{ ans: 2078000 }], how: '7264000 − 5186000 = 2078000\n先把「萬」都換成數字，再對齊位數相減。' },
      { q: '45 萬 8000 + 37 萬 6000 = ？\n（寫成數字）', fields: [{ ans: 834000 }], how: '458000 + 376000 = 834000' },
      { q: '3051200 − 1786400 = ？', fields: [{ ans: 1264800 }], how: '3051200 − 1786400 = 1264800\n記得借位：每一位不夠減，就向前一位借 1。' },
      { q: '這個月的收入是 2468000 元，上個月比這個月少 32 萬 5000 元。上個月的收入是多少元？', fields: [{ ans: 2143000, after: '元' }], how: '上個月比較「少」，所以用減的：\n2468000 − 325000 = 2143000\n32 萬 5000 = 325000，不是 3205000。' },
      { q: '今年收成 84 萬 200 公斤，比去年多了 6000 公斤。去年收成多少公斤？', fields: [{ ans: 834200, after: '公斤' }], how: '今年比去年「多」，所以去年比較少，用減的：\n840200 − 6000 = 834200' },
      { q: '12 月的遊客是 96500 人，比 11 月多 12000 人。11 月的遊客是多少人？', fields: [{ ans: 84500, after: '人' }], how: '12 月比 11 月多，所以 11 月比較少：\n96500 − 12000 = 84500' },
      { q: '110 年的人口約 2316 萬人，109 年比 110 年多約 21 萬人。109 年的人口約多少人？\n（寫成數字）', fields: [{ ans: 23370000, after: '人' }], how: '2316 萬 + 21 萬 = 2337 萬\n2337 萬 = 23370000' },
      { q: '一個八位數：千萬位 6、百萬位 3、十萬位空著、萬位 5，其他都是 0。\n哥哥在十萬位填最大的數字，弟弟填最小的數字。兩個數相差多少？', fields: [{ ans: 900000 }], how: '哥哥填 9：63950000\n弟弟填 0：63050000\n只有十萬位不一樣，相差 9 個十萬 = 900000' }
    ]
  },
  {
    title: '第二單元：乘法', sub: '直式乘法、幾個 0、兩步驟應用題',
    qs: [
      { q: '48 × 36 = ？', fields: [{ ans: 1728 }], how: '48 × 6 = 288\n48 × 30 = 1440\n288 + 1440 = 1728' },
      { q: '135 × 24 = ？', fields: [{ ans: 3240 }], how: '135 × 4 = 540\n135 × 20 = 2700\n540 + 2700 = 3240' },
      { q: '207 × 43 = ？', fields: [{ ans: 8901 }], how: '207 × 3 = 621\n207 × 40 = 8280\n621 + 8280 = 8901\n直式相加時，進位要記得加上去。' },
      { q: '已知 64 × 25 = 1600，那 64 × 24 = ？', fields: [{ ans: 1536 }], how: '64 × 24 比 64 × 25 少 1 個 64：\n1600 − 64 = 1536' },
      { q: '不用直式：一盒玫瑰賣 300 元，買 99 盒要多少元？', fields: [{ ans: 29700, after: '元' }], how: '99 盒 = 100 盒少 1 盒\n300 × 100 = 30000\n30000 − 300 = 29700' },
      { q: '30 × 600 的答案有幾個 0？', fields: [{ ans: 3, after: '個 0' }], how: '30 × 600 = 18000，有 3 個 0。' },
      { q: '125 × 80 的答案有幾個 0？', fields: [{ ans: 4, after: '個 0' }], how: '125 × 80 = 10000，有 4 個 0。\n小心：125 × 8 = 1000 自己就有 0，所以比你想的多。' },
      { q: '每天寫 45 頁，從 3 月 1 日寫到 4 月 30 日，一共寫了幾頁？', fields: [{ ans: 2745, after: '頁' }], how: '3 月有 31 天，4 月有 30 天，共 61 天\n45 × 61 = 2745' },
      { mc: ['剩下 60 顆', '不夠 60 顆', '剩下 160 顆', '不夠 160 顆'], answer: 1, q: '一包糖有 6 顆，一盒有 8 包。學校買了 30 盒，要送給 1500 人每人 1 顆。會剩下還是不夠幾顆？', how: '一盒 6 × 8 = 48 顆\n30 盒 48 × 30 = 1440 顆\n1500 − 1440 = 60，所以不夠 60 顆。' },
      { q: '一個蛋糕 150 元，每買 5 個送 1 個。一共拿到 20 個蛋糕，要付多少元？', fields: [{ ans: 2550, after: '元' }], how: '付 5 個拿 6 個。20 個 = 6 + 6 + 6 + 2\n要付 5 + 5 + 5 + 2 = 17 個\n150 × 17 = 2550' },

      {"mc": ["西北", "東北", "西南", "東南"], "answer": 0, "q": "下午 2 點，影子在「東南方」，太陽在哪個方位？", "how": "東 ↔ 西，南 ↔ 北 → 西北。"},
      {"mc": ["由西到東", "由東到西", "由南到北", "都不會變"], "answer": 1, "q": "從上午到下午，太陽在天空中的方位怎麼變？", "how": "太陽東升西落：由東到西。\n影子則是由西到東。"},

      {"mc": ["○ 正確", "✕ 不正確"], "answer": 0, "q": "觀測太陽時，中午的影子最短。", "how": "對！中午太陽最高，影子最短。"},
      {"mc": ["○ 正確", "✕ 不正確"], "answer": 0, "q": "我們用肉眼看到的星星，顏色有很多種。", "how": "對！星星有白、藍、黃、紅等不同顏色。"}
    ]
  },
  {
    title: "自然：水生植物、動物和水域", sub: "挺水、浮葉、漂浮、沉水；魚怎麼呼吸",
    qs: [
      {"mc": ["挺水性", "浮葉性", "漂浮性", "沉水性"], "answer": 1, "q": "睡蓮屬於哪一種水生植物？", "how": "睡蓮：根長在水底泥土裡，葉子「平貼」在水面 → 浮葉性。"},
      {"mc": ["挺水性", "浮葉性", "漂浮性", "沉水性"], "answer": 0, "q": "蓮（荷花）屬於哪一種水生植物？", "how": "荷花：根在泥土裡，葉子「挺出」水面 → 挺水性。"},
      {"mc": ["莖的粗細", "根有沒有長在泥土裡", "葉子的顏色", "葉子是挺出水面，還是平貼水面"], "answer": 3, "q": "怎麼分辨荷花和睡蓮？", "how": "兩個的根都在泥土裡，所以不能用根分。\n荷花葉子挺出水面，睡蓮葉子平貼水面。"},
      {"mc": ["○ 正確", "✕ 不正確"], "answer": 1, "q": "睡蓮的葉柄柔軟，荷花的葉柄堅硬，但兩者的葉子都平貼在水面上。", "how": "荷花的葉子是「挺出」水面的，不是平貼。"},
      {"mc": ["睡蓮", "香蒲", "布袋蓮", "荷花"], "answer": 2, "q": "下列哪一種水生植物可以「整株」漂浮在水面？", "how": "布袋蓮、大萍是漂浮性：根浮在水中，不在土裡。\n睡蓮的根在土裡，不是整株漂浮。"},
      {"mc": ["○ 正確", "✕ 不正確"], "answer": 0, "q": "部分水生植物的根可以漂浮在水中，不會長在水底的土裡。", "how": "對！漂浮性植物，例如布袋蓮、大萍。"},
      {"mc": ["○ 正確", "✕ 不正確"], "answer": 0, "q": "空心菜的根長在水面下的土裡，葉子挺出水面，所以空心菜是挺水性植物。", "how": "對！根在土裡 + 葉子挺出水面 = 挺水性。"},
      {"mc": ["○ 正確", "✕ 不正確"], "answer": 1, "q": "水生植物用通氣組織來儲存養分。", "how": "通氣組織儲存的是「空氣」，不是養分。\n空氣讓植物可以浮起來、在水中呼吸。"},
      {"mc": ["葉柄變成紅色", "冒出很多氣泡", "葉柄一直下沉", "葉子長出水珠"], "answer": 1, "q": "把布袋蓮切開的葉柄放進水中擠壓，會看到什麼？", "how": "題目問「看到什麼」：會冒出很多氣泡。\n原因是：葉柄裡有通氣組織，存著空氣。"},
      {"mc": ["○ 正確", "✕ 不正確"], "answer": 0, "q": "水珠在大萍葉面上不會散開，是因為葉面有很多細毛，這也幫助它浮在水面。", "how": "對！細毛可以防水，幫助大萍漂浮。"},
      {"mc": ["水由鰓流入，又由鰓流出", "水由口流入，由鰓流出", "水由鰓流入，由口流出", "用鼻子呼吸"], "answer": 1, "q": "大多數的魚在水中怎麼呼吸？", "how": "魚用「鰓」呼吸：\n水從嘴巴進去，經過鰓，再從鰓蓋流出來。"},
      {"mc": ["用鮮豔的花紋游動，用嘴巴呼吸", "用鰭游動，用鰓呼吸", "用腳游動，用肺呼吸", "用尾巴游動，用鼻子呼吸"], "answer": 1, "q": "小丑魚用什麼構造游動？用什麼構造呼吸？", "how": "鰭（尤其是尾鰭擺動）讓魚游動，鰓用來呼吸。\n顏色和游泳沒有關係。題目有兩個問題，兩個都要答。"},
      {"mc": ["○ 正確", "✕ 不正確"], "answer": 1, "q": "椎實螺用四隻腳在水中行走。", "how": "椎實螺沒有腳，是用肌肉發達的「腹足」爬行。"},
      {"mc": ["○ 正確", "✕ 不正確"], "answer": 0, "q": "螃蟹的腳能夠在水中划水前進。", "how": "對！螃蟹的腳可以走路，也可以划水。"},
      {"mc": ["蝌蚪", "螞蟻", "蝦", "孔雀魚"], "answer": 1, "q": "池塘的水都乾掉了，哪一種生物還可以生存？", "how": "蝌蚪、蝦、孔雀魚都要在水裡才能活。\n螞蟻是陸地上的動物。"},
      {"mc": ["是世界上最大的水域環境", "屬於鹹水的水域", "很少生物生存在這裡"], "answer": 2, "q": "小丑魚生活的水域環境，下列哪一項「錯誤」？", "how": "題目問「錯誤」！\n海洋是最大的水域，是鹹水，而且有非常多生物。"},
      {"mc": ["溪流", "池塘", "海洋", "水田"], "answer": 2, "q": "下列哪一個是「鹹水」的水域環境？", "how": "鹹水：海洋。淡水：溪流、池塘、湖泊、水田。"},
      {"mc": ["海洋", "河流", "潮間帶", "珊瑚礁"], "answer": 1, "q": "下列哪一個是「淡水」的水域環境？", "how": "淡水：河流、溪流、湖泊、池塘。\n海洋和珊瑚礁是鹹水。"}
    ]
  }
];

var app = document.getElementById('app');
var titleEl = document.getElementById('title'), subEl = document.getElementById('sub');
var unit, quiz, at, picks, orders, next, fullRun = true;

/* ---------- Where she stopped, on this device and online ---------- */
// Kept in this browser and sent to admin.shiptolive.com, so she can stop on one
// device and carry on on another. Online is best effort: offline it still saves here.
var SYNC = 'https://admin.shiptolive.com/api/practice', WHO = 'joie', LOCAL = 'joie-progress';
function readLocal() { try { return JSON.parse(localStorage.getItem(LOCAL)) || { t: 0, units: {} }; } catch (e) { return { t: 0, units: {} }; } }
var saved = readLocal(), pushTimer = null;
function writeLocal() { try { localStorage.setItem(LOCAL, JSON.stringify(saved)); } catch (e) {} }
function push() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function () {
    try {
      fetch(SYNC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ who: WHO, data: saved }), keepalive: true }).catch(function () {});
    } catch (e) {}
  }, 600);
}
function savePlace() {
  if (!unit || !fullRun) return;
  saved.units[unit.title] = { ids: quiz.map(function (q) { return unit.qs.indexOf(q); }), picks: picks.map(function (x) { return x === undefined ? null : x; }), at: at };
  saved.t = Date.now();
  writeLocal(); push();
}
function clearPlace() {
  if (!unit || !saved.units[unit.title]) return;
  delete saved.units[unit.title];
  saved.t = Date.now();
  writeLocal(); push();
}
function placeOf(u) {
  var pl = saved.units[u.title];
  return pl && pl.ids.length === u.qs.length && pl.ids.every(function (i) { return u.qs[i]; }) ? pl : null;
}
function pull() {
  fetch(SYNC + '?who=' + WHO, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.ok && j.data && j.data.t > saved.t) {
      saved = j.data; if (!saved.units) saved.units = {};
      writeLocal();
      if (!unit) menu();
    } else if (j && j.ok && saved.t > ((j.data && j.data.t) || 0)) push();
  }).catch(function () {});
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function shuffle(list) {
  var a = list.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
// Accept 1,234 / 1 234 / full-width digits.
function clean(v) {
  return String(v || '').replace(/[０-９]/g, function (d) { return String.fromCharCode(d.charCodeAt(0) - 65248); }).replace(/[,，\s]/g, '');
}
function isRight(item, pick) {
  if (pick === undefined || pick === null) return false;
  if (item.mc) return pick === item.answer;
  return item.fields.every(function (f, i) { return clean(pick[i]) === String(f.ans); });
}
function answerText(item, pick) {
  if (arguments.length > 1 && (pick === undefined || pick === null)) return '（沒有作答）';
  if (item.mc) return item.mc[pick];
  return item.fields.map(function (f, i) { return (pick ? clean(pick[i]) || '（空白）' : f.ans) + (f.after ? ' ' + f.after : ''); }).join('　');
}
function say(text) {
  var v = window.speechSynthesis;
  if (!v) return;
  if (v.speaking || v.pending) { v.cancel(); return; }
  var u = new SpeechSynthesisUtterance(text.replace(/□/g, '方格').replace(/∠/g, '角'));
  u.lang = 'zh-TW'; u.rate = 0.9;
  v.speak(u);
}
function hush() { if (window.speechSynthesis) window.speechSynthesis.cancel(); }

function menu() {
  hush();
  unit = null;
  titleEl.textContent = '四年級練習';
  subEl.textContent = '選一個單元開始練習。';
  app.textContent = '';
  var box = el('div', 'choices');
  UNITS.forEach(function (u) {
    var b = el('button', 'choice pick');
    b.type = 'button';
    var t = el('span');
    t.appendChild(el('b', '', u.title));
    t.appendChild(el('span', 'meta', u.sub + ' · ' + u.qs.length + ' 題'));
    b.appendChild(t);
    var pl = placeOf(u);
    if (pl) {
      var n = pl.picks.filter(function (x) { return x !== null; }).length;
      t.appendChild(el('span', 'meta', '進行中：已做 ' + n + ' / ' + u.qs.length + ' 題，點一下接著做'));
    }
    b.onclick = function () { unit = u; titleEl.textContent = u.title; subEl.textContent = u.sub; resume(u); };
    box.appendChild(b);
  });
  app.appendChild(box);
}

function resume(u) {
  var pl = placeOf(u);
  fullRun = true;
  if (!pl) { start(u.qs); return; }
  quiz = pl.ids.map(function (i) { return u.qs[i]; });
  picks = pl.picks.map(function (x) { return x === null ? undefined : x; });
  orders = [];
  // Carry on at the first unanswered question from where she was, then from the start.
  var from = typeof pl.at === 'number' ? pl.at : 0, n = quiz.length;
  at = 0;
  for (var k = 0; k < n; k++) { var i = (from + k) % n; if (picks[i] === undefined) { at = i; break; } }
  show();
}
function start(list) {
  quiz = shuffle(list);
  at = 0; picks = []; orders = [];
  show();
}

function show() {
  var item = quiz[at];
  hush();
  app.textContent = '';
  var back = el('button', 'back', at === 0 ? '← 回到單元' : '← 上一題');
  back.type = 'button';
  back.onclick = function () { if (at === 0) menu(); else { at--; show(); } };
  if (fullRun) {
    var stop = el('button', 'stop', '先停在這裡（已儲存）');
    stop.type = 'button';
    stop.onclick = menu;
    app.appendChild(stop);
  }
  app.appendChild(back);
  var bar = el('div', 'bar'), fill = el('i');
  fill.style.width = (at / quiz.length * 100) + '%';
  bar.appendChild(fill);
  app.appendChild(bar);
  app.appendChild(el('div', 'count', '第 ' + (at + 1) + ' 題，共 ' + quiz.length + ' 題'));
  // Tap a number to go straight to that question. Green and red are answered ones.
  var jump = el('div', 'jump');
  jump.setAttribute('aria-label', '跳到第幾題');
  quiz.forEach(function (q, i) {
    var j = el('button', '', String(i + 1));
    j.type = 'button';
    if (picks[i] !== undefined) j.className = isRight(q, picks[i]) ? 'ok' : 'bad';
    if (i === at) { j.className += ' cur'; j.setAttribute('aria-current', 'step'); }
    j.onclick = function () { at = i; savePlace(); show(); };
    jump.appendChild(j);
  });
  app.appendChild(jump);

  var card = el('div', 'card');
  card.appendChild(el('p', 'q', item.q));
  if (window.speechSynthesis) {
    var sp = el('button', 'back', '🔊 唸題目');
    sp.type = 'button';
    sp.onclick = function () { say(item.q + (item.mc ? '。' + item.mc.map(function (o, i) { return (i + 1) + '，' + o; }).join('。') : '')); };
    card.appendChild(sp);
  }
  var done = picks[at] !== undefined;

  if (item.mc) {
    var box = el('div', 'choices');
    item.mc.forEach(function (o, i) {
      var c = el('button', 'choice');
      c.type = 'button';
      c.dataset.i = i;
      c.appendChild(el('span', 'num', '①②③④'.charAt(i)));
      c.appendChild(el('span', '', o));
      c.onclick = function () { picks[at] = i; savePlace(); reveal(item, card); };
      box.appendChild(c);
    });
    card.appendChild(box);
  } else {
    var form = el('form', 'fields');
    item.fields.forEach(function (f, i) {
      var inp = el('input');
      inp.type = 'text';
      inp.inputMode = 'numeric';
      inp.autocomplete = 'off';
      inp.setAttribute('aria-label', '答案' + (f.after ? '，' + f.after : ''));
      if (item.fields.length > 1 || String(f.ans).length < 4) inp.className = 'short';
      form.appendChild(inp);
      if (f.after) form.appendChild(el('span', '', f.after));
    });
    var check = el('button', 'primary', '對答案');
    check.type = 'submit';
    form.onsubmit = function (e) {
      e.preventDefault();
      var vals = Array.prototype.map.call(form.querySelectorAll('input'), function (x) { return x.value; });
      if (vals.some(function (v) { return !clean(v); })) { form.querySelector('input').focus(); return; }
      picks[at] = vals;
      savePlace();
      reveal(item, card);
    };
    card.appendChild(form);
    if (!done) card.appendChild(check);
    check.onclick = function () { form.requestSubmit ? form.requestSubmit() : form.onsubmit(new Event('submit')); };
  }
  app.appendChild(card);
  if (done) reveal(item, card);
  else if (!item.mc) setTimeout(function () { var x = card.querySelector('input'); if (x) x.focus(); }, 50);
}

function reveal(item, card) {
  var pick = picks[at], ok = isRight(item, pick);
  var old = card.querySelector('.primary'); if (old) old.remove();
  if (item.mc) {
    card.querySelectorAll('.choice').forEach(function (b) {
      b.disabled = true;
      var i = Number(b.dataset.i);
      if (i === item.answer) b.classList.add('right');
      else if (i === pick) b.classList.add('wrong');
    });
  } else {
    card.querySelectorAll('.fields input').forEach(function (x, i) {
      x.value = clean(pick[i]);
      x.disabled = true;
      x.classList.add(clean(pick[i]) === String(item.fields[i].ans) ? 'right' : 'wrong');
    });
  }
  var f = el('div', 'feedback ' + (ok ? 'right' : 'wrong'));
  f.appendChild(el('strong', '', ok ? '答對了！' : '再想想看。正確答案：' + answerText(item)));
  f.appendChild(el('div', 'how', item.how));
  card.appendChild(f);
  var last = at === quiz.length - 1;
  var gap = picks.length < quiz.length ? -1 : -1;
  for (var g = 0; g < quiz.length; g++) if (picks[g] === undefined) { gap = g; break; }
  next = el('button', 'primary', last ? (gap >= 0 ? '還有題目沒做 →' : '看成績') : '下一題');
  next.type = 'button';
  next.onclick = function () { if (!last) { at++; show(); } else if (gap >= 0) { at = gap; show(); } else done(); };
  card.appendChild(next);
  next.focus();
}

function done() {
  hush();
  if (fullRun) clearPlace();
  var wrong = [];
  quiz.forEach(function (item, i) { if (!isRight(item, picks[i])) wrong.push({ item: item, pick: picks[i] }); });
  var total = quiz.length, right = total - wrong.length;
  app.textContent = '';
  var card = el('div', 'card');
  card.appendChild(el('p', 'score', right + ' / ' + total));
  card.appendChild(el('p', 'msg', right === total ? '全部答對，太厲害了！' : right / total >= 0.8 ? '很棒！看看下面錯的題目。' : '加油！看看下面錯的題目，再練一次。'));
  if (wrong.length) {
    card.appendChild(el('h2', '', '錯了 ' + wrong.length + ' 題'));
    var ul = el('ul', 'missed');
    wrong.forEach(function (m) {
      var li = el('li');
      li.appendChild(el('b', '', m.item.q));
      var was = el('span', 'ba was'); was.appendChild(el('small', '', '你的答案')); was.appendChild(document.createTextNode(answerText(m.item, m.pick)));
      var now = el('span', 'ba now'); now.appendChild(el('small', '', '正確答案')); now.appendChild(document.createTextNode(answerText(m.item)));
      li.appendChild(was); li.appendChild(now);
      li.appendChild(el('span', 'how', m.item.how));
      ul.appendChild(li);
    });
    card.appendChild(ul);
    var again = el('button', 'primary', '再練錯的 ' + wrong.length + ' 題');
    again.type = 'button';
    again.onclick = function () { fullRun = false; start(wrong.map(function (m) { return m.item; })); };
    card.appendChild(again);
  }
  var all = el('button', wrong.length ? 'secondary' : 'primary', '整個單元重做');
  all.type = 'button';
  all.onclick = function () { fullRun = true; clearPlace(); start(unit.qs); };
  card.appendChild(all);
  var pick = el('button', 'secondary', '換一個單元');
  pick.type = 'button';
  pick.onclick = menu;
  card.appendChild(pick);
  app.appendChild(card);
}

menu();
pull();
</script>
