<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Practice Quizzes</title>
<style>
  :root {
    --bg: #f6f7f4; --card: #ffffff; --ink: #1d2433; --muted: #5d6675; --line: #d6dae0;
    --accent: #1f5fa8; --good: #17693a; --good-bg: #e4f5ea; --bad: #a92c21; --bad-bg: #fbe9e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 16px; margin: 0 0 20px; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-bottom: 6px; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .count { color: var(--muted); font-size: 15px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .q { font-size: 21px; font-weight: 600; margin: 0 0 18px; }
  .q.big { font-size: 30px; line-height: 1.3; }
  .q u { text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .blank { display: inline-block; min-width: 4.5em; border-bottom: 3px solid var(--ink); }
  .choices { display: grid; gap: 10px; }
  .choices.inline { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .choices.inline .choice { min-height: 72px; }
  .choices.mark { grid-template-columns: repeat(3, 1fr); }
  button { font: inherit; cursor: pointer; }
  .choice {
    display: flex; gap: 12px; align-items: center; width: 100%; min-height: 56px; padding: 10px 14px; text-align: left;
    color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 10px;
  }
  .choices.inline .choice { justify-content: center; text-align: center; }
  .choices.mark .choice { justify-content: center; font-size: 30px; font-weight: 700; }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice:disabled { cursor: default; color: var(--ink); }
  .choice[aria-pressed="true"] { border-color: var(--accent); background: #eaf1fa; }
  .choice.test b { display: block; }
  a.choice { text-decoration: none; }
  .meta { display: block; color: var(--muted); font-size: 15px; }
  .ask { color: var(--muted); font-size: 16px; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 18px; letter-spacing: 1px; margin: -8px 0 14px; word-break: break-all; }
  .speak {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 14px; margin-bottom: 14px;
    color: var(--accent); background: transparent; border: 2px solid var(--accent); border-radius: 999px; font-size: 16px; font-weight: 600;
  }
  .feedback .speak { margin: 10px 0 0; }
  .speak[hidden] { display: none; }
  .back {
    min-height: 44px; padding: 6px 12px 6px 0; margin-bottom: 10px; color: var(--accent);
    background: transparent; border: 0; font-size: 16px; font-weight: 600;
  }
  .letter { flex: none; font-weight: 700; color: var(--muted); }
  .choice.right { background: var(--good-bg); border-color: var(--good); }
  .choice.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .choice.miss { border: 2px dashed var(--good); }
  .typed { display: grid; gap: 10px; }
  .field {
    width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; color: var(--ink); background: #fff;
    border: 2px solid var(--line); border-radius: 10px; resize: vertical;
  }
  .field.right { background: var(--good-bg); border-color: var(--good); }
  .field.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .feedback { margin-top: 16px; padding: 12px 14px; border-radius: 10px; }
  .feedback.right { background: var(--good-bg); color: var(--good); }
  .feedback.wrong { background: var(--bad-bg); color: var(--bad); }
  .feedback strong { display: block; }
  .feedback .def { color: var(--ink); margin-top: 4px; }
  .feedback .zh { color: var(--muted); margin-top: 2px; }
  .feedback .you { color: var(--ink); margin-top: 4px; }
  .feedback ul { list-style: none; margin: 6px 0 0; padding: 0; color: var(--ink); }
  .feedback li.ok::before { content: "✓ "; color: var(--good); font-weight: 700; }
  .feedback li.no::before { content: "✗ "; color: var(--bad); font-weight: 700; }
  .primary {
    width: 100%; min-height: 54px; margin-top: 16px; color: #fff; background: var(--accent);
    border: 0; border-radius: 10px; font-weight: 600;
  }
  .typed .primary, .chips + .primary { margin-top: 4px; }
  .primary:disabled { opacity: .5; cursor: default; }
  .secondary {
    width: 100%; min-height: 54px; margin-top: 10px; color: var(--accent); background: transparent;
    border: 2px solid var(--accent); border-radius: 10px; font-weight: 600;
  }
  .score { font-size: 52px; font-weight: 700; line-height: 1.1; margin: 0; }
  .msg { margin: 6px 0 18px; }
  h2 { font-size: 18px; margin: 18px 0 8px; }
  h2.group { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
  h2.group:first-child { margin-top: 0; }
  .missed { list-style: none; margin: 0; padding: 0; }
  .missed li { padding: 10px 0; border-top: 1px solid var(--line); }
  .missed b { display: block; }
  .missed span { display: block; font-size: 16px; }
  .missed b { margin-bottom: 4px; font-weight: 600; }
  .missed .was { color: var(--bad); }
  .missed .fix { color: var(--good); font-weight: 600; }
  .missed .zh { color: var(--muted); }
  .zc { display: inline-flex; align-items: center; margin-right: .12em; font-size: 1.4em; line-height: 1.25; }
  .zy { display: inline-flex; align-items: flex-start; margin-left: 2px; font-size: .55em; line-height: 1.05; color: var(--muted); font-weight: 400; }
  .zl { writing-mode: vertical-rl; text-orientation: upright; }
  .zt { margin-left: 1px; }
  .zy.n { flex-direction: column; align-items: center; }
  .zy.n .zt { margin: 0 0 1px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Practice Quizzes</h1>
  <p class="sub" id="sub">Pick a quiz.</p>
  <div id="app" aria-live="polite"></div>
</main>
<script>
/* ---------- Social Studies (multiple choice; the stem is the worksheet's own definition) ---------- */
// Chapter 2 stems are the worksheet's own definitions, with the word blanked out.
var CHAPTER2 = [
  { w: 'relative location', q: '___ tells where something is by comparing it to something else.', zh: '相對位置', near: ['absolute location', 'legend', 'compass rose'] },
  { w: 'absolute location', q: 'The exact spot where a place is located is its ___. It may include a place\'s house number, street, town, and state.', zh: '絕對位置', near: ['relative location', 'town', 'symbols'] },
  { w: 'town', q: 'A ___ is a small community.', zh: '城鎮', near: ['city', 'continent', 'harbor'] },
  { w: 'symbols', q: 'These small pictures are called ___. An object that stands for something else.', zh: '符號／標誌', near: ['legend', 'compass rose', 'globe'] },
  { w: 'legend', q: 'The map key, or ___, shows the different symbols. It tells what each means.', zh: '圖例', near: ['symbols', 'compass rose', 'globe'] },
  { w: 'city', q: 'A ___ is a very large community, much larger than a town.', zh: '城市', near: ['town', 'continent', 'ocean'] },
  { w: 'compass rose', q: 'A ___ shows directions on the map. It is a directional indicator.', zh: '羅盤玫瑰', near: ['legend', 'symbols', 'globe'] },
  { w: 'landform', q: 'Earth has different shapes of land. Each shape is called a ___.', zh: '地形', near: ['continent', 'globe', 'harbor'] },
  { w: 'ocean', q: 'An ___ is a large body of salt water.', zh: '海洋', near: ['harbor', 'continent', 'landform'] },
  { w: 'continent', q: 'A ___ is a large land area on Earth.', zh: '大陸／大洲', near: ['landform', 'ocean', 'city'] },
  { w: 'globe', q: 'A ___ is a round model of Earth.', zh: '地球儀', near: ['compass rose', 'continent', 'legend'] },
  { w: 'migrate', q: 'People move, or ___, from one place to another.', zh: '遷移／移居', near: ['harbor', 'landform', 'town'] },
  { w: 'harbor', q: 'A ___ is a safe place near land where ships are tied up.', zh: '港口', near: ['ocean', 'town', 'migrate'] }
];

// The worksheet's definitions as written. Its printed Chinese is garbled, so `zh` here is our own gloss.
var REVIEW27 = [
  { w: 'primary source', q: 'Something made or written by someone who saw or experienced an event.', zh: '第一手資料', near: ['secondary source', 'historian', 'biography'] },
  { w: 'journal', q: 'A daily record of thoughts and events in a person\'s life.', zh: '日記', near: ['biography', 'autobiography', 'artifact'] },
  { w: 'artifact', q: 'An object made and used by people.', zh: '文物', near: ['architecture', 'journal', 'tradition'] },
  { w: 'architecture', q: 'How buildings are designed.', zh: '建築', near: ['artifact', 'culture', 'history'] },
  { w: 'secondary source', q: 'Something written or made by someone who did not see an event happen.', zh: '第二手資料', near: ['primary source', 'journal', 'family tree'] },
  { w: 'biography', q: 'A book about a person\'s life written by someone else.', zh: '傳記', near: ['autobiography', 'journal', 'oral history'] },
  { w: 'autobiography', q: 'A story about a person\'s life written by that person.', zh: '自傳', near: ['biography', 'family tree', 'oral history'] },
  { w: 'historian', q: 'Someone who studies and writes about history.', zh: '歷史學家', near: ['guardian', 'ancestor', 'immigrant'] },
  { w: 'family', q: 'A group of people who live together and experience the world together.', zh: '家庭', near: ['community', 'generation', 'culture'] },
  { w: 'community', q: 'A place where people live, work, and play together; also a group sharing interests and beliefs.', zh: '社區', near: ['family', 'culture', 'citizen'] },
  { w: 'respect', q: 'Being kind and fair to others.', zh: '尊重', near: ['responsible', 'practice', 'tradition'] },
  { w: 'responsible', q: 'Taking care of important things.', zh: '負責任的', near: ['respect', 'practice', 'guardian'] },
  { w: 'extended family', q: 'A family that includes more than parents and children, such as aunts and uncles.', zh: '大家庭', near: ['family', 'generation', 'family tree'] },
  { w: 'generation', q: 'People born and living about the same time.', zh: '世代', near: ['ancestor', 'extended family', 'community'] },
  { w: 'guardian', q: 'Someone who cares for a child.', zh: '監護人', near: ['ancestor', 'historian', 'citizen'] },
  { w: 'immigrant', q: 'A person who moves from one country to another.', zh: '移民', near: ['citizen', 'ancestor', 'guardian'] },
  { w: 'practice', q: 'To follow teachings and rules.', zh: '奉行', near: ['tradition', 'respect', 'examine'] },
  { w: 'citizen', q: 'A person who belongs to a country.', zh: '公民', near: ['immigrant', 'guardian', 'community'] },
  { w: 'tradition', q: 'Something passed down over time.', zh: '傳統', near: ['culture', 'practice', 'history'] },
  { w: 'history', q: 'The story of the past, including people, events, places, and objects.', zh: '歷史', near: ['historian', 'tradition', 'culture'] },
  { w: 'compare', q: 'To see how two or more things are similar.', zh: '比較（找相同）', near: ['contrast', 'examine', 'practice'] },
  { w: 'contrast', q: 'To see how two or more things are different.', zh: '對比（找不同）', near: ['compare', 'examine', 'respect'] },
  { w: 'ancestor', q: 'A relative who lived long before your grandparents.', zh: '祖先', near: ['generation', 'guardian', 'historian'] },
  { w: 'culture', q: 'A way of life.', zh: '文化', near: ['tradition', 'community', 'history'] },
  { w: 'oral history', q: 'Recorded information from a person who experienced an event.', zh: '口述歷史', near: ['history', 'family tree', 'biography'] },
  { w: 'examine', q: 'To study something closely and carefully.', zh: '仔細檢視', near: ['compare', 'contrast', 'practice'] },
  { w: 'family tree', q: 'A drawing or diagram that shows how family members are related.', zh: '家譜', near: ['extended family', 'generation', 'ancestor'] }
];

/* ---------- Question builders for the English worksheets ---------- */
// Item kinds: mc (word + 3 near words), pick (choose one option), multi (choose all that apply),
// type (type the answer), write (write your own; we check the objective rules only).
CHAPTER2.forEach(function (x) { x.kind = 'mc'; });
REVIEW27.forEach(function (x) { x.kind = 'mc'; });

// Spelling: "english | 中文 | other accepted answers (;)". The Chinese is the prompt.
function V(text) {
  return text.trim().split('\n').map(function (line) {
    var p = line.split('|').map(function (s) { return s.trim(); });
    return {
      kind: 'type', spell: true, q: p[1], zh: p[1], a: p[0],
      alts: p[2] ? p[2].split(';').map(function (s) { return s.trim(); }) : [],
      ask: p[0].indexOf('/') >= 0 ? 'Write the English words. Put a slash (/) between them.' : 'Write the English word.'
    };
  });
}
// Type a sentence or word. Strict = capitals and punctuation must match exactly.
// Recognition: see the English word, pick its Chinese meaning (no spelling).
function R(text) {
  var base = V(text);
  return base.map(function (x, i) {
    var others = shuffle(base.filter(function (y, j) { return j !== i && y.zh !== x.zh; }).map(function (y) { return y.zh; })).slice(0, 3);
    return P(x.a, others.concat([x.zh]), x.zh, { big: true, shuffle: true, ask: 'What does this word mean? Pick the Chinese.' });
  });
}
function T(q, a, o) { return extend({ kind: 'type', q: q, a: a, alts: [] }, o); }
function S(q, a, o) { return extend({ kind: 'type', q: q, a: a, alts: [], strict: true }, o); }
function P(q, options, a, o) { return extend({ kind: 'pick', q: q, options: options, a: a, alt: [] }, o); }
function M(q, options, a, o) { return extend({ kind: 'multi', q: q, options: options, a: a }, o); }
function W(q, o) { return extend({ kind: 'write', q: q, min: 3 }, o); }
function extend(x, o) { if (o) for (var k in o) x[k] = o[k]; return x; }
function inherit(items, o) { items.forEach(function (x) { for (var k in o) if (x[k] === undefined) x[k] = o[k]; }); return items; }

var NA = ['Naming part (N)', 'Action part (A)'];
var YN = ['YES', 'NO'];
var TQ = ['Telling sentence', 'Question'];
var MARK = ['.', '?', '!'];
var TQ_TIP = 'A telling sentence ends with a period (.). A question ends with a question mark (?).';

function naList(rows) {
  return rows.map(function (r) { return P(r[0], NA, r[1] === 'N' ? NA[0] : NA[1]); });
}
function ynList(rows) {
  return rows.map(function (r) { return P(r[0], YN, r[1]); });
}
function tqList(rows) {
  return rows.map(function (r) { return P(r[0], TQ, r[1] === 'T' ? TQ[0] : TQ[1], { tip: TQ_TIP }); });
}
function markList(rows) {
  return rows.map(function (r) { return P(r[0] + ' ___', MARK, r[1], { alt: r[2] ? [r[2]] : [] }); });
}
function fixList(rows) {
  return rows.map(function (r) { return S(r[0], r[1], { alts: r[2] ? [r[2]] : [] }); });
}

/* ---------- Test 1: Unit 1 Cumulative Review ---------- */
var U1_VOCAB = [
  { title: 'Words: Grammar & sentence types', items: R(
    'sentence|句子\nnaming part|主語／命名部分\naction part|動作部分\ntelling sentence|敘述句\nquestion|疑問句\n' +
    'command|祈使句／命令句\nexclamation|感嘆句\ncapital letter|大寫字母\nperiod|句號\nquestion mark|問號\n' +
    'exclamation point|驚嘆號\nend mark|句末標點\nunderline|畫底線\ncomplete|完整的\nproofread|校對\n' +
    'correct|正確的／訂正\nstrong feeling|強烈情緒') },
  { title: 'Words: People & animals', items: R(
    'children|孩子們\nfriend|朋友\nteacher|老師\nfarmer|農夫\ngirl|女孩\nboy|男孩\ntwins|雙胞胎\nkittens|小貓們\n' +
    'puppy|小狗\nturtle|烏龜\nrobin|知更鳥\nfrog|青蛙\nlions|獅子們\nbears|熊們\nroosters|公雞們\nbees|蜜蜂們\n' +
    'spider|蜘蛛\nsquirrel|松鼠\nwhiskers|鬍鬚\nmonkeys|猴子們\ncaterpillar|毛毛蟲') },
  { title: 'Words: Action words', items: R(
    'buzz|嗡嗡叫\nspin|紡／織\ncrawl|爬行\nleap|跳躍\nskip|跳步\ndrip|滴落\ngrowl|低吼\nhowl|嚎叫\ncrow|啼叫\nmoo|哞哞叫\n' +
    'chew|咀嚼\nbloom|開花\nchirp|啁啾叫\nshine|發光\nnap|小睡\nhop|單跳／跳躍\nhide|躲藏\ncount|數數\n' +
    'look around|環顧四周\npull|拉\nfollow|跟隨\ndribble|運球\ntoss|拋\npick up|撿起\ntake off|起飛\nland|降落\n' +
    'rub|摩擦\nshake hands|握手\ntaste|嚐起來\nset|落下／擺設\nroar|吼叫\nbuzz loudly|大聲嗡嗡叫') },
  { title: 'Words: Things, places & nature', items: R(
    'balloon|氣球\nparade|遊行\nband|樂隊\nmusic|音樂\nmovie|電影\ndrum|鼓\nbaseball|棒球\nsnacks|點心\npopcorn|爆米花\n' +
    'storm|暴風雨\nweather|天氣\nrainbow|彩虹\nraindrops|雨滴\nwoods|樹林\nleaves|葉子\nbee|蜜蜂\nhoney|蜂蜜\n' +
    'wings|翅膀\nweb|蜘蛛網\nacorns|橡實\nseeds|種子\ngrass|草\nhay|乾草\nstone|石頭\nsquare|正方形\ngoal|球門／目標\n' +
    'rope|繩子\nfire drill|消防演習\nrocket|火箭\nMars|火星\nladder|梯子\nstriped|有條紋的') },
  { title: 'Words: Useful phrases', items: R(
    'be quiet|保持安靜\ndo not let go|不要放手\ntake this rope|拿這條繩子\npull hard|用力拉\nline up|排隊\n' +
    'walk quickly|快走\nlisten to the rules|聽規則\nplay this game|玩這個遊戲\ngo away|走開\nhelp me|幫助我\n' +
    'I am afraid|我很害怕\nI love that song|我喜歡那首歌\ngreat job|做得好\ngood news|好消息\nwhat time|幾點\n' +
    'what color|什麼顏色\nwhat is the weather|天氣如何\nas fast as you can|盡可能快\nhold my hand|牽我的手') }
];

var U1_GRAMMAR = [
  { title: 'A. Naming part or action part', items: inherit(naList([
    ['The [[puppy]] runs in the yard.', 'N'], ['The birds [[fly over the trees]].', 'A'], ['[[My best friend]] likes music.', 'N'],
    ['The sun [[was setting]].', 'A'], ['A big frog [[jumps into the pond]].', 'A'], ['[[Two young girls]] play soccer.', 'N'],
    ['The teacher [[opened the door]].', 'A'], ['[[The little kitten]] sleeps.', 'N'], ['The boys [[laughed loudly]].', 'A'],
    ['[[Raindrops]] fall on the roof.', 'N'], ['A squirrel [[climbed the tree]].', 'A'], ['[[Those monkeys]] shake hands.', 'N']
  ]), { ask: 'Are the underlined words the naming part or the action part?',
        tip: 'The naming part tells who or what the sentence is about. The action part tells what happens.' }) },
  { title: 'B. Is it a complete sentence?', items: inherit(ynList([
    ['Bright stars.', 'NO'], ['The airplane landed.', 'YES'], ['Runs to school.', 'NO'], ['A blue balloon floats.', 'YES'],
    ['The yellow flowers.', 'NO'], ['Children play in the park.', 'YES'], ['Under the big tree.', 'NO'], ['The fish swims fast.', 'YES'],
    ['Made a loud noise.', 'NO'], ['Our teacher reads a book.', 'YES'], ['Three noisy roosters.', 'NO'], ['My sister and I walked home.', 'YES']
  ]), { ask: 'YES if it is a complete sentence. NO if it is not.',
        tip: 'A complete sentence has a naming part (who or what) and an action part (what happens).' }) },
  { title: 'C. Telling sentence or question?', items: inheritAsk(tqList([
    ['Do bees make honey', 'Q'], ['The kitten has whiskers', 'T'], ['What time is it', 'Q'], ['We like the parade', 'T'],
    ['Is the squirrel hungry', 'Q'], ['The sky is blue', 'T'], ['Where did the plane land', 'Q'], ['Children ride bikes', 'T'],
    ['Will you come with us', 'Q'], ['The storm is coming', 'T'], ['How many wings does a bee have', 'Q'], ['The monkey likes bananas', 'T']
  ]), 'Is it a telling sentence or a question?') },
  { title: 'D. Choose the end mark', items: inherit(markList([
    ['Where is my backpack', '?'], ['Please close the window', '.', '!'], ['What an amazing rainbow', '!'], ['The puppy is asleep', '.'],
    ['Run as fast as you can', '!', '.'], ['Help me', '!', '.'], ['How big is the rocket', '?'], ['This is wonderful news', '!'],
    ['Our friends went to a movie', '.'], ['Are the bees near the flowers', '?'], ['Take this rope', '.', '!'], ['I am so excited', '!']
  ]), { ask: 'Which end mark goes at the end?',
        tip: 'Telling sentences and commands usually end with a period (.). Questions end with (?). Strong feelings end with (!).' }) },
  { title: 'E. Fix capital letters and end marks', items: inherit(fixList([
    ['where are the rockets built', 'Where are the rockets built?'], ['the cat naps on the chair', 'The cat naps on the chair.'],
    ['do not let go', 'Do not let go.', 'Do not let go!'], ['what a beautiful picture', 'What a beautiful picture!'],
    ['is the moon bright tonight', 'Is the moon bright tonight?'], ['the woods are dark', 'The woods are dark.'],
    ['follow your teacher', 'Follow your teacher.', 'Follow your teacher!'], ['the bees have wings', 'The bees have wings.'],
    ['help me', 'Help me!', 'Help me.'], ['what color are the leaves', 'What color are the leaves?'],
    ['please walk quickly', 'Please walk quickly.', 'Please walk quickly!'], ['we watched the plane take off', 'We watched the plane take off.'],

function zhText(parent, text) {

  }
  add(item.end.indexOf(s.slice(-1)) >= 0, 'Ends with ' + endLabel(item.end));
  add(s.split(' ').length >= item.min, 'Is long enough to have a naming part and an action part');
  if (item.start) add(low.indexOf(item.start.toLowerCase()) === 0, 'Begins with “' + item.start + '”');
  if (item.after) add(low.indexOf(item.after) > 0, 'Uses “' + item.after + '”');
  return notes;
}
function grade(item, resp) {
  if (item.kind === 'mc') return { ok: resp === item.w };
  if (item.kind === 'pick') return { ok: resp === item.a || item.alt.indexOf(resp) >= 0 };
  if (item.kind === 'multi') return { ok: same(resp, item.a) };
  if (item.kind === 'type') {
    var list = [item.a].concat(item.alts || []);
    return { ok: list.some(function (x) { return item.strict ? squash(resp) === x : norm(resp) === norm(x); }) };
  }
  var notes = writeCheck(item, resp);
  return { ok: notes.every(function (n) { return n.ok; }), notes: notes };
}

/* ---------- Read aloud with the device's own voices ---------- */
// Each part: [text, lang]. Tapping again while it talks stops it.
function say(parts) {
  var v = window.speechSynthesis;
  if (!v) return;
  if (v.speaking || v.pending) { v.cancel(); return; }
  parts.forEach(function (p) {
    var u = new SpeechSynthesisUtterance(p[0]);
    u.lang = p[1];
    u.rate = 0.9;
    v.speak(u);
  });
}
function hush() { if (window.speechSynthesis) window.speechSynthesis.cancel(); }
function speakButton(label, parts) {
  var b = el('button', 'speak', '🔊 ' + label);
  b.type = 'button';
  b.onclick = function () { say(parts()); };
  if (!window.speechSynthesis) b.hidden = true;
  return b;
}

/* ---------- Best scores, kept on this device only ---------- */
function bests() { try { return JSON.parse(localStorage.getItem('josie-best') || '{}'); } catch (e) { return {}; } }
function saveBest(key, right, total) {
  try {
    var b = bests();
    if (!b[key] || right / total > b[key][0] / b[key][1]) { b[key] = [right, total]; localStorage.setItem('josie-best', JSON.stringify(b)); }
  } catch (e) {}
}

/* ---------- Menus ---------- */
function setHead(t, s) { titleEl.textContent = t; subEl.textContent = s; }
function count(t) {
  if (!t.parts) return t.items.length;
  return t.parts.reduce(function (n, p) { return n + p.items.length; }, 0);
}

function menu() {
  hush();
  cur = null;
  setHead('Practice Quizzes', 'Pick a quiz.');
  app.textContent = '';
  MENU.forEach(function (g) {
    app.appendChild(el('h2', 'group', g.group));
    var box = el('div', 'choices');
    g.tests.forEach(function (t) {
      var b = el('button', 'choice test');
      b.type = 'button';
      var txt = el('span');
      txt.appendChild(el('b', '', t.title));
      txt.appendChild(el('span', 'meta', t.sub + ' · ' + count(t) + ' questions' + (t.parts ? ' · ' + t.parts.length + ' parts' : '')));
      b.appendChild(txt);
      b.onclick = function () {
        if (t.parts) parts(t);
        else begin({ key: t.id, title: t.title, sub: t.sub, items: t.items, back: menu, backLabel: 'Pick a different test' });
      };
      box.appendChild(b);
    });
    app.appendChild(box);
  });
  app.appendChild(el('h2', 'group', 'Links'));
  var links = el('div', 'choices');
  var a = el('a', 'choice test');
  a.href = 'https://rungwise.app/start';
  a.target = '_blank';
  a.rel = 'noopener';
  var at2 = el('span');
  at2.appendChild(el('b', '', 'Rungwise'));
  at2.appendChild(el('span', 'meta', 'rungwise.app/start · opens in a new tab'));
  a.appendChild(at2);
  links.appendChild(a);
  app.appendChild(links);
}

function parts(t) {
  hush();
  setHead(t.title, t.sub);
  app.textContent = '';
  var back = el('button', 'back', '← All quizzes');
  back.type = 'button';
  back.onclick = menu;
  app.appendChild(back);
  var best = bests();
  var box = el('div', 'choices');
  t.parts.forEach(function (p, i) {
    var key = t.id + '-' + i;
    var b = el('button', 'choice test');
    b.type = 'button';
    var txt = el('span');
    txt.appendChild(el('b', '', p.title));
    var meta = p.items.length + ' questions';
    if (best[key]) meta += ' · Best: ' + best[key][0] + ' / ' + best[key][1];
    txt.appendChild(el('span', 'meta', meta));
    b.appendChild(txt);
    b.onclick = function () {
      begin({ key: key, title: t.title, sub: p.title, items: p.items, back: function () { parts(t); }, backLabel: 'Pick a different part' });
    };
    box.appendChild(b);
  });
  app.appendChild(box);
  var mix = el('button', 'secondary', 'Mixed practice: 20 random questions');
  mix.type = 'button';
  mix.onclick = function () {
    var pool = [];
    t.parts.forEach(function (p) { p.items.forEach(function (x) { if (x.kind !== 'write') pool.push(x); }); });
    begin({ title: t.title, sub: 'Mixed practice', items: function () { return shuffle(pool).slice(0, 20); }, back: function () { parts(t); }, backLabel: 'Pick a different part' });
  };
  app.appendChild(mix);
}

function begin(ctx) {
  cur = ctx;
  setHead(ctx.title, ctx.sub);
  start(items());
}
function items() { return typeof cur.items === 'function' ? cur.items() : cur.items; }

function start(list) {
  quiz = shuffle(list);
  at = 0;
  picks = [];
  orders = [];
  show();
}

/* ---------- One question ---------- */
function stem(item) {
  var wrap = el('div');
  var ask = item.ask || (item.kind === 'mc' && item.q.indexOf('___') < 0 ? 'Which word matches this meaning?' : '');
  if (ask) wrap.appendChild(el('div', 'ask', ask));
  var p = el('p', item.spell || item.big ? 'q big' : 'q');
  if (item.spell) zhText(p, item.zh); else rich(p, item.q);
  wrap.appendChild(p);
  if (item.spell) {
    var h = el('div', 'hint', item.a.split('').map(function (c) { return /[A-Za-z]/.test(c) ? '_' : c === ' ' ? ' ' : c; }).join(' '));
    h.setAttribute('aria-hidden', 'true');
    wrap.appendChild(h);
  }
  return wrap;
}
function readQuestion(item, box) {
  if (item.spell) return [[speakAnswer(item), 'en-US']];
  var parts = [[plain(item.q).replace(/___/g, 'blank').replace(/\s+[+·→]\s+/g, ', '), 'en-US']];
  if (item.kind === 'mc') {
    box.querySelectorAll('button').forEach(function (b, i) { parts.push(['ABCD'.charAt(i) + '. ' + cap(b.dataset.word), 'en-US']); });
  }
  return parts;
}

// Builds the answer area. Returns { el, lock(resp, ok) }.
function answerArea(item, card) {
  var box = el('div', 'choices');
  var kind = item.kind;

  if (kind === 'mc') {
    if (!orders[at]) orders[at] = shuffle([item.w].concat(item.near));
    orders[at].forEach(function (word, i) {
      var c = el('button', 'choice');
      c.type = 'button';
      c.dataset.word = word;
      c.appendChild(el('span', 'letter', 'ABCD'.charAt(i)));
      c.appendChild(el('span', '', cap(word)));
      c.onclick = function () { submit(word); };
      box.appendChild(c);
    });
    return { el: box, box: box, lock: function (resp) {
      box.querySelectorAll('button').forEach(function (b) {
        b.disabled = true;
        if (b.dataset.word === item.w) b.classList.add('right');
        else if (b.dataset.word === resp) b.classList.add('wrong');
      });
    } };
  }

  if (kind === 'pick') {
    var opts = item.shuffle ? (orders[at] = orders[at] || shuffle(item.options)) : item.options;
    var shortest = opts.every(function (o) { return o.length <= 2; }), small = opts.every(function (o) { return o.length <= 16; });
    var zh = opts.some(function (o) { return /[\u3400-\u9fff]/.test(o); });
    box.className = 'choices' + (zh ? '' : shortest ? ' mark' : small ? ' inline' : '');
    opts.forEach(function (o) {
      var c = el('button', 'choice');
      zhText(c, o);
      c.type = 'button';
      c.dataset.opt = o;
      c.onclick = function () { submit(o); };
      box.appendChild(c);
    });
    return { el: box, box: box, lock: function (resp) {
      box.querySelectorAll('button').forEach(function (b) {
        b.disabled = true;
        var o = b.dataset.opt, good = o === item.a || (o === resp && item.alt.indexOf(o) >= 0);
        if (good) b.classList.add('right');
        else if (o === resp) b.classList.add('wrong');
      });
    } };
  }

  if (kind === 'multi') {
    box.className = 'choices inline chips';
    var chosen = [];
    var go = el('button', 'primary', 'Check');
    go.type = 'button';
    go.disabled = true;
    item.options.forEach(function (o) {
      var c = el('button', 'choice', o);
      c.type = 'button';
      c.dataset.opt = o;
      c.setAttribute('aria-pressed', 'false');
      c.onclick = function () {
        var i = chosen.indexOf(o);
        if (i >= 0) chosen.splice(i, 1); else chosen.push(o);
        c.setAttribute('aria-pressed', i >= 0 ? 'false' : 'true');
        go.disabled = !chosen.length;
      };
      box.appendChild(c);
    });
    go.onclick = function () { submit(chosen.slice()); };
    var wrap = el('div');
    wrap.appendChild(box);
    wrap.appendChild(go);
    return { el: wrap, box: box, lock: function (resp) {
      go.hidden = true;
      box.querySelectorAll('button').forEach(function (b) {
        var o = b.dataset.opt, want = item.a.indexOf(o) >= 0, got = resp.indexOf(o) >= 0;
        b.disabled = true;
        b.setAttribute('aria-pressed', got ? 'true' : 'false');
        if (want && got) b.classList.add('right');
        else if (want) b.classList.add('miss');
        else if (got) b.classList.add('wrong');
      });
    } };
  }

  // type / write
  var wrapT = el('div', 'typed');
  var f = el(kind === 'write' ? 'textarea' : 'input', 'field');
  if (kind === 'write') f.rows = 3; else f.type = 'text';
  f.setAttribute('autocapitalize', 'off');
  f.setAttribute('autocomplete', 'off');
  f.setAttribute('autocorrect', 'off');
  f.setAttribute('spellcheck', 'false');
  f.setAttribute('aria-label', 'Your answer');
  var go2 = el('button', 'primary', 'Check');
  go2.type = 'button';
  function check() { if (!f.value.trim()) { f.focus(); return; } submit(f.value); }
  go2.onclick = check;
  if (kind === 'type') f.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); check(); } };
  wrapT.appendChild(f);
  wrapT.appendChild(go2);
  return { el: wrapT, focus: function () { f.focus(); }, lock: function (resp, ok) {
    f.value = resp;
    f.disabled = true;
    f.classList.add(ok ? 'right' : 'wrong');
    go2.hidden = true;
  } };
}

var area, submit;

function show() {
  var item = quiz[at];
  hush();
  app.textContent = '';
  // First question goes back to the part list. Later ones show the previous question,
  // with its answer locked, so going back can't change the score.
  var back = el('button', 'back', at === 0 ? '← ' + (cur.backLabel || 'Back') : '← Back');
  back.type = 'button';
  back.onclick = function () { if (at === 0) cur.back(); else { at--; show(); } };
  app.appendChild(back);
  var bar = el('div', 'bar'), fillBar = el('i');
  fillBar.style.width = (at / quiz.length * 100) + '%';
  bar.appendChild(fillBar);
  app.appendChild(bar);
  app.appendChild(el('div', 'count', 'Question ' + (at + 1) + ' of ' + quiz.length));

  var card = el('div', 'card');
  card.appendChild(stem(item));
  area = answerArea(item, card);
  card.appendChild(speakButton(item.spell ? 'Hear the word' : 'Read it to me', function () { return readQuestion(item, area.box); }));
  card.appendChild(area.el);
  app.appendChild(card);
  var here = at, a = area;
  submit = function (resp) {
    if (picks[here] !== undefined) return;
    picks[here] = resp;
    reveal(item, resp, a, card);
    next.focus();
  };
  if (picks[at] !== undefined) reveal(item, picks[at], area, card);
  else if (area.focus && matchMedia('(hover: hover)').matches) area.focus();
}

function reveal(item, resp, a, card) {
  var res = grade(item, resp), ok = res.ok;
  a.lock(resp, ok);
  var f = el('div', 'feedback ' + (ok ? 'right' : 'wrong'));
  var head;
  if (item.kind === 'write') head = ok ? 'Looks good!' : 'Almost. Check the list.';
  else if (ok) head = 'Correct!';
  else if (item.kind === 'mc') head = 'Not quite. The answer is ' + cap(item.w) + '.';
  else head = 'Not quite. The answer is: ' + answerText(item);
  var strong = el('strong');
  if (!ok && item.kind !== 'mc' && item.kind !== 'write') put(strong, 'Not quite. The answer is: ', answerText(item));
  else strong.textContent = head;
  f.appendChild(strong);
  if (item.kind === 'write') {
    var ul = el('ul');
    res.notes.forEach(function (n) { ul.appendChild(el('li', n.ok ? 'ok' : 'no', n.label)); });
    f.appendChild(ul);
    f.appendChild(el('div', 'def', 'Example: ' + item.sample));
    f.appendChild(el('div', 'zh', 'Ask a grown-up to read it and check that it makes sense.'));
  } else {
    if (!ok && item.kind === 'type' && item.strict) f.appendChild(el('div', 'you', 'You wrote: ' + squash(resp)));
    var line = filled(item);
    if (line) f.appendChild(el('div', 'def', line));
    if (item.spell && ok) f.appendChild(el('div', 'def', item.a));
    if (!ok && item.tip) f.appendChild(el('div', 'def', item.tip));
    if (item.zh) f.appendChild(put(el('div', 'zh'), '', item.zh));
    if (ok && item.alt && item.alt.indexOf(resp) >= 0) f.appendChild(el('div', 'zh', 'The other choice works too, but “' + item.a + '” is the one we were looking for.'));
    if (ok && item.alts && item.alts.length && item.kind === 'type' && !item.spell) f.appendChild(el('div', 'zh', 'Also correct: ' + item.alts.join(', ')));
    f.appendChild(speakButton('Read the answer', function () {
      var parts = [[(ok ? 'Correct! ' : 'The answer is ' + (item.kind === 'mc' ? item.w + '. ' : '')) + (item.spell ? speakAnswer(item) : (filled(item) ? filled(item).replace(/^[^:]*: /, '') : answerText(item))), 'en-US']];
      if (item.zh && item.kind !== 'write') parts.push([item.zh.replace(/[（）／、]/g, '，'), 'zh-TW']);
      return parts;
    }));
  }
  card.appendChild(f);
  var last = at === quiz.length - 1;
  next = el('button', 'primary', last ? 'See my score' : 'Next question');
  next.type = 'button';
  next.onclick = function () { at++; if (last) done(); else show(); };
  card.appendChild(next);
}

function done() {
  hush();
  var missed = [];
  quiz.forEach(function (item, i) {
    if (!grade(item, picks[i]).ok) missed.push({ item: item, picked: picks[i] });
  });
  var total = quiz.length, right = total - missed.length;
  if (cur.key) saveBest(cur.key, right, total);
  app.textContent = '';
  var card = el('div', 'card');
  card.appendChild(el('p', 'score', right + ' / ' + total));
  card.appendChild(el('p', 'msg',
    right === total ? 'Perfect score. Great job!' :
    right / total >= 0.8 ? 'Very good. Look at the wrong answers below.' :
    'Good try. Look at the wrong answers below and go again.'));
  if (missed.length) {
    card.appendChild(el('h2', '', missed.length === 1 ? '1 wrong answer' : missed.length + ' wrong answers'));
    var ul = el('ul', 'missed');
    missed.forEach(function (m) {
      var li = el('li');
      li.appendChild(put(el('b'), '', promptText(m.item)));
      var said = Array.isArray(m.picked) ? m.picked.join(', ') : (m.item.kind === 'mc' ? cap(m.picked) : m.picked);
      li.appendChild(put(el('span', 'was'), '✗ You ' + (m.item.kind === 'type' || m.item.kind === 'write' ? 'wrote: ' : 'picked: '), said));
      li.appendChild(put(el('span', 'fix'), m.item.kind === 'write' ? '✓ Example: ' : '✓ Correct answer: ', answerText(m.item)));
      if (m.item.zh && !m.item.spell) li.appendChild(put(el('span', 'zh'), '', m.item.zh));
      ul.appendChild(li);
    });
    card.appendChild(ul);
    var again = el('button', 'primary', missed.length === 1 ? 'Try this one again' : 'Try these ' + missed.length + ' again');
    again.type = 'button';
    var retry = missed.map(function (m) { return m.item; });
    again.onclick = function () { start(retry); };
    card.appendChild(again);
  }
  var all = el('button', missed.length ? 'secondary' : 'primary', 'Start the whole quiz over');
  all.type = 'button';
  all.onclick = function () { start(items()); };
  card.appendChild(all);
  var pick = el('button', 'secondary', cur.backLabel || 'Pick a different test');
  pick.type = 'button';
  pick.onclick = cur.back;
  card.appendChild(pick);
  app.appendChild(card);
}

menu();
</script>
</body>
</html>
