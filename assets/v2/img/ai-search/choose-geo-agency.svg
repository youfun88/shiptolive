<text x="30" y="48" font-size="22" font-weight="700" fill="#161513">簽約前檢查清單</text><rect x="30" y="82" width="26" height="26" rx="6" fill="#d7612a"/><path d="M36 95 l5 5 10-11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="103" font-size="20" fill="#2b2926">怎麼量測 AI 有沒有提到我？</text><rect x="30" y="130" width="26" height="26" rx="6" fill="#d7612a"/><path d="M36 143 l5 5 10-11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="151" font-size="20" fill="#2b2926">看得到每次檢測結果嗎？</text><rect x="30" y="178" width="26" height="26" rx="6" fill="#d7612a"/><path d="M36 191 l5 5 10-11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="199" font-size="20" fill="#2b2926">內容上線前要我同意嗎？</text></g>
